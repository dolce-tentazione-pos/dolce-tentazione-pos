<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dolce Tentazione | Punto de Venta</title>
<style>
:root{--wine:#7f3658;--pink:#c87898;--cream:#fff9fb;--ink:#30282b;--muted:#756c70;--line:#eadde2;--white:#fff;--green:#208b55}
*{box-sizing:border-box} body{margin:0;background:#faf7f8;color:var(--ink);font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#30282b,#563744);color:#fff;padding:25px 18px 22px;text-align:center;position:sticky;top:0;z-index:20}
header h1{font-family:Georgia,serif;font-size:31px;margin:0 0 6px} header p{margin:0;color:#f8e9ef}
main{max-width:900px;margin:auto;padding:18px 14px 110px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:5px 0 14px;position:sticky;top:92px;background:#faf7f8;z-index:10}
.categories button{border:1px solid var(--line);background:#fff;border-radius:22px;padding:10px 14px;white-space:nowrap;font-weight:bold;color:var(--ink)}
.categories button.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.section-title{font-family:Georgia,serif;font-size:26px;margin:15px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 3px 12px #4b28300d}
.card h3{margin:0 0 6px;font-size:18px}.desc{color:var(--muted);font-size:14px;min-height:38px}
.price{font-size:21px;font-weight:800;color:var(--wine);margin:10px 0}
.add{width:100%;border:0;border-radius:12px;background:var(--pink);color:#fff;padding:11px;font-size:16px;font-weight:bold}
.cartbar{position:fixed;bottom:12px;left:12px;right:12px;max-width:876px;margin:auto;background:var(--wine);color:#fff;border-radius:18px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 25px #0003;z-index:30}
.cartbar button{background:#fff;color:var(--wine);border:0;border-radius:12px;padding:10px 14px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end;justify-content:center}
.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:650px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}
.sheet h2{margin-top:0;font-family:Georgia,serif}.item{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:18px}
.total{font-size:24px;font-weight:bold;color:var(--wine);display:flex;justify-content:space-between;margin:18px 0}
label{display:block;font-weight:bold;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9cbd1;border-radius:11px;font-size:16px}
.transferBox{display:none;background:#fff7fa;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;line-height:1.7;color:var(--ink)}.transferBox.show{display:block}.transferBox b{color:var(--wine)}.transferBox small{display:block;color:var(--muted);margin-top:5px}.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1;padding:13px;border-radius:12px;font-weight:bold;border:0}.close{background:#eee}.send{background:var(--green);color:#fff}
.empty{text-align:center;color:var(--muted);padding:25px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.categories{top:91px}.card{padding:14px}}
</style>
</head>
<body>
<header>
<h1>Dolce Tentazione</h1>
<p>Viernes de rebanaditas · pedidos y ventas</p>
</header>

<main>
<div class="categories" id="cats"></div>
<div id="products"></div>
</main>

<div class="cartbar">
<div>🛒 <b id="cartCount">0</b> productos · <b id="cartTotal">$0</b></div>
<button onclick="openCart()">Ver carrito</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeCart()">
<div class="sheet">
<h2>🛒 Tu pedido</h2>
<div id="cartItems"></div>
<div class="total"><span>Total</span><span id="modalTotal">$0</span></div>

<label>Nombre</label><input id="customer" placeholder="Tu nombre">
<label>Forma de pago</label>
<select id="payment" onchange="toggleTransfer()"><option>Efectivo</option><option>Transferencia</option></select>
<div id="transferBox" class="transferBox">
  <b>Datos para transferencia</b>
  <div>Banco: <span id="bankName">Banco Azteca</span></div>
  <div>Beneficiario: <span id="bankHolder">Karina López</span></div>
  <div>CLABE / cuenta: <span id="bankAccount">4198 2101 2685 8983</span></div>
  <small>Una vez realizada la transferencia, envía tu comprobante por WhatsApp.</small>
</div>
<label>Notas</label><textarea id="notes" rows="2" placeholder="Ej. sin nuez, recoger a las 5 pm..."></textarea>

<div class="actions">
<button class="close" onclick="closeCart()">Seguir comprando</button>
<button class="send" onclick="sendWhatsApp()">Enviar por WhatsApp</button>
</div>
</div>
</div>

<script>
const WA="525532699350";
const data=[
{cat:"🍰 Repostería",items:[
["Rebanada de especialidad","Sabores disponibles del día",40],
["Flan","Flan casero",37],
["Pay frío","Postre frío artesanal",45],
["Cupcake decorado","Decoración especial",35],
["Galleta Crumbl","Galleta grande estilo artesanal",45],
["Polvorones","Polvorones caseros",30],
["Pastel de crepas","Fresas con crema",50],
["Besitos de nuez","Bolsa de besitos de nuez",40]
]},
{cat:"☕ Bebidas calientes",items:[
["Café americano","Café recién preparado",30],
["Capuchino","Capuchino clásico",35],
["Latte saborizado","Elige tu sabor",40,["Caramelo","Mazapán","Rompope","Oreo","Moka","Taro","Chocolate blanco"]],
["Chocolate caliente","Chocolate caliente",40]
]},
{cat:"🧋 Frappés",items:[
["Frappuchino clásico","Bebida fría cremosa",50],
["Frappé de sabor","Elige tu sabor",60,["Oreo","Caramelo","Moka","Mazapán","Rompope","Taro","Chocolate blanco"]],
["Frappé especial","Frutos rojos, fresas con crema o Gansito",70,["Frutos rojos","Fresas con crema","Gansito"]]
]},
{cat:"🥤 Bebidas frías",items:[
["Soda italiana","Elige tu sabor",50,["Manzana verde","Mora azul"]],
["Icee","Bebida fría tipo Icee",55],
["Chamoyada","Elige tu sabor",60,["Fresa","Mango"]],
["Tisana ponche","Tisana sabor ponche",40]
]}
];

let cart=JSON.parse(localStorage.getItem("dt_cart")||"[]");
let current="all";

function money(n){return "$"+n.toLocaleString("es-MX")}
function save(){localStorage.setItem("dt_cart",JSON.stringify(cart));renderCartBar()}
function renderCats(){
 const el=document.getElementById("cats");
 el.innerHTML='<button class="active" data-cat="all">Todo</button>'+data.map((x,i)=>`<button data-cat="${i}">${x.cat}</button>`).join("");
 el.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.cat;el.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderProducts()});
}
function renderProducts(){
 const el=document.getElementById("products"); let groups=current==="all"?data:[data[Number(current)]];
 el.innerHTML=groups.map(g=>`<section><h2 class="section-title">${g.cat}</h2><div class="grid">${g.items.map((p,i)=>`
 <article class="card"><h3>${p[0]}</h3><div class="desc">${p[1]}</div>
 ${p[3]?`<select id="flavor-${data.indexOf(g)}-${i}" aria-label="Elegir sabor"><option value="">Elegir sabor</option>${p[3].map(f=>`<option>${f}</option>`).join("")}</select>`:""}
 <div class="price">${money(p[2])}</div>
 <button class="add" onclick="addItem(${data.indexOf(g)},${i})">Agregar</button></article>`).join("")}</div></section>`).join("");
}
function addItem(gi,ii){
 const p=data[gi].items[ii];
 let flavor="";
 if(p[3]){
   const select=document.getElementById(`flavor-${gi}-${ii}`);
   flavor=select ? select.value : "";
   if(!flavor){alert("Elige un sabor antes de agregar.");return;}
 }
 const label=flavor ? `${p[0]} — ${flavor}` : p[0];
 const found=cart.find(x=>x.name===label);
 if(found)found.qty++; else cart.push({name:label,price:p[2],qty:1});
 save(); openCart();
}
function removeItem(i){cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);save();renderCart()}
function addQty(i){cart[i].qty++;save();renderCart()}
function renderCartBar(){
 const count=cart.reduce((s,x)=>s+x.qty,0), total=cart.reduce((s,x)=>s+x.qty*x.price,0);
 document.getElementById("cartCount").textContent=count;document.getElementById("cartTotal").textContent=money(total);
}
function renderCart(){
 const el=document.getElementById("cartItems");
 if(!cart.length){el.innerHTML='<div class="empty">Tu carrito está vacío.</div>'}
 else el.innerHTML=cart.map((x,i)=>`<div class="item"><div><b>${x.name}</b><br><small>${money(x.price)} c/u</small></div><div class="qty"><button onclick="removeItem(${i})">−</button><b>${x.qty}</b><button onclick="addQty(${i})">+</button></div></div>`).join("");
 document.getElementById("modalTotal").textContent=money(cart.reduce((s,x)=>s+x.qty*x.price,0));
}
function openCart(){document.getElementById("modal").classList.add("open");renderCart();toggleTransfer()}
function closeCart(){document.getElementById("modal").classList.remove("open")}
function toggleTransfer(){
 const box=document.getElementById("transferBox");
 const payment=document.getElementById("payment");
 if(box && payment) box.style.display=payment.value==="Transferencia"?"block":"none";
}
function sendWhatsApp(){
 if(!cart.length){alert("Agrega al menos un producto.");return}
 const name=document.getElementById("customer").value.trim()||"Cliente";
 const pay=document.getElementById("payment").value;
 const notes=document.getElementById("notes").value.trim()||"Sin notas";
 const total=cart.reduce((s,x)=>s+x.qty*x.price,0);
 let text=`Hola Dolce Tentazione 🍰%0A%0A*Nuevo pedido*%0A`;
 text+=`Nombre: ${encodeURIComponent(name)}%0A%0A`;
 cart.forEach(x=>text+=`${x.qty} x ${encodeURIComponent(x.name)} — ${money(x.qty*x.price)}%0A`);
 text+=`%0A*Total: ${money(total)}*%0AForma de pago: ${encodeURIComponent(pay)}%0ANotas: ${encodeURIComponent(notes)}`;
 window.open(`https://wa.me/${WA}?text=${text}`,"_blank");
}
renderCats();renderProducts();renderCartBar();
</script>
</body>
</html>
