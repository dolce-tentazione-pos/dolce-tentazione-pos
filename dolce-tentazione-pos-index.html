<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#30282b">
<title>Dolce Tentazione · POS</title>
<style>
:root{--ink:#30282b;--rose:#c97998;--soft:#f4e5ea;--bg:#fbf7f8;--green:#198754}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 16px}.wrap{max-width:1000px;margin:auto;padding:16px}
.brand{font:700 30px Georgia,serif}.sub{margin-top:5px;color:#eadfe3}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{white-space:nowrap;border:0;border-radius:20px;padding:10px 14px;background:var(--soft);font-weight:700}
.tab.active{background:var(--rose);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card,.cart,.admin{background:#fff;border:1px solid #eadde2;border-radius:16px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 6px}.desc{color:#74696e;font-size:14px;min-height:20px}.price{font-size:21px;font-weight:800;color:#a34e6d;margin-top:10px}
button{border:0;border-radius:11px;padding:11px 14px;font-weight:700}.add{background:var(--rose);color:#fff;width:100%;margin-top:10px}
.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.qty button{background:var(--soft);padding:6px 10px}.total{display:flex;justify-content:space-between;font-size:24px;font-weight:900;margin-top:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.full{grid-column:1/-1}
label{font-weight:700}input,select,textarea{width:100%;padding:12px;margin-top:5px;border:1px solid #d8cbd0;border-radius:10px;font-size:16px}
textarea{min-height:70px}.wa{background:var(--green);color:#fff;width:100%;margin-top:12px;font-size:17px}.secondary{background:#eee;margin-top:10px;width:100%}
.admin{background:var(--ink);color:#fff;margin-top:20px}.adminPanel{background:#fff;color:var(--ink);padding:12px;border-radius:12px;margin-top:12px}.hidden{display:none}
.sale{padding:9px 0;border-bottom:1px solid #ddd}.small{font-size:13px;color:#74696e}
@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.cartrow{grid-template-columns:1fr auto}.cartrow .line{grid-column:2}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">Dolce Tentazione</div><div class="sub">Viernes de rebanaditas · pedidos y ventas</div></div></header>
<main class="wrap">
<h2>Menú</h2>
<div id="tabs" class="tabs"></div>
<div id="products" class="grid"></div>

<section class="cart">
<h2>🛒 Carrito <span id="count">(0)</span></h2>
<div id="cart"></div>
<div class="total"><span>Total</span><span id="total">$0</span></div>
<div class="form">
<div><label>Nombre</label><input id="nombre" placeholder="Nombre del cliente"></div>
<div><label>Forma de pago</label><select id="pago"><option>Efectivo</option><option>Transferencia</option></select></div>
<div class="full"><label>Nota</label><textarea id="nota" placeholder="Observaciones"></textarea></div>
</div>
<button class="wa" onclick="whatsapp()">📱 Enviar pedido por WhatsApp</button>
<button class="secondary" onclick="vaciar()">Vaciar carrito</button>
</section>

<section class="admin">
<h2>🔐 Administración</h2>
<button onclick="admin()">Abrir administración</button>
<div id="ap" class="adminPanel hidden">
<label>PIN</label><input type="password" id="pin" placeholder="PIN">
<button class="wa" onclick="login()">Entrar</button>
<div id="ventas" class="hidden"><h3>Ventas</h3><div id="lista"></div><h3>Total: <span id="st">$0</span></h3></div>
</div>
</section>
</main>
<footer class="wrap small" style="text-align:center">Dolce Tentazione · La Magdalena Contreras, CDMX · WhatsApp 55 3269 9350</footer>

<script>
const M={
"🍰 Repostería":[
["Rebanada de especialidad","Sabores disponibles del día",40],
["Flan","Flan casero",37],["Pay frío","Postre frío artesanal",35],
["Cupcake","Decorado",35],["Galleta crumbl","Galleta grande",40],
["Polvorones","Caseros",30],["Pastel de crepas","Fresas con crema / chocolate",50]],
"☕ Bebidas calientes":[
["Café americano","",30],["Capuchino","",35],
["Latte saborizado","Caramelo · Mazapán · Rompope · Oreo · Moka · Taro · Chocolate blanco",40],
["Chocolate caliente","",40]],
"🥤 Frappés":[
["Frappuccino clásico","",50],
["Frappé sabor","Oreo · Caramelo · Moka · Mazapán · Rompope · Taro · Chocolate blanco",60],
["Especialidad","Frutos rojos · Fresas con crema · Gansito",70]],
"🧊 Bebidas frías":[
["Soda italiana","Manzana verde · Mora azul",50],["Icee","",55],
["Chamoyada","Fresa · Mango",60],["Tisana ponche","",40]]
};
let cat=Object.keys(M)[0],cart=[];
function render(){
tabs.innerHTML=Object.keys(M).map((x,i)=>'<button class="tab '+(x==cat?'active':'')+'" onclick="setcat('+i+')">'+x+'</button>').join('');
products.innerHTML=M[cat].map((p,i)=>'<article class="card"><h3>'+p[0]+'</h3><div class="desc">'+p[1]+'</div><div class="price">$'+p[2]+'</div><button class="add" onclick="add('+i+')">Agregar al carrito</button></article>').join('');
renderCart()
}
function setcat(i){cat=Object.keys(M)[i];render()}
function add(i){let p=M[cat][i],x=cart.find(a=>a.n==p[0]);x?x.q++:cart.push({n:p[0],p:p[2],q:1});renderCart()}
function ch(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);renderCart()}
function renderCart(){
if(!cart.length)cartEl='<p class="small">Tu carrito está vacío.</p>';else cartEl=cart.map((x,i)=>'<div class="cartrow"><div><b>'+x.n+'</b><br><span class="small">$'+x.p+' c/u</span></div><div class="qty"><button onclick="ch('+i+',-1)">−</button> '+x.q+' <button onclick="ch('+i+',1)">+</button></div><b class="line">$'+x.p*x.q+'</b></div>').join('');
cart.innerHTML=cartEl;let t=cart.reduce((s,x)=>s+x.p*x.q,0),c=cart.reduce((s,x)=>s+x.q,0);total.textContent='$'+t;count.textContent='('+c)
}
function vaciar(){cart=[];renderCart()}
function whatsapp(){
if(!cart.length)return alert('Agrega productos al carrito.');
let n=nombre.value.trim()||'Cliente',pay=pago.value,note=nota.value.trim()||'Sin nota',t=cart.reduce((s,x)=>s+x.p*x.q,0);
let m='🍰 *PEDIDO DOLCE TENTAZIONE*%0A%0A👤 '+n+'%0A%0A';cart.forEach(x=>m+='• '+x.q+' x '+x.n+' — $'+x.p*x.q+'%0A');m+='%0A💰 *TOTAL: $'+t+'*%0A💳 '+pay+'%0A📝 '+note;
let a=JSON.parse(localStorage.dt||'[]');a.push({fecha:new Date().toLocaleString('es-MX'),cliente:n,total:t,pago:pay,items:cart.map(x=>x.q+'x '+x.n).join(' | ')});localStorage.dt=JSON.stringify(a);
location.href='https://wa.me/525532699350?text='+m
}
function admin(){ap.classList.toggle('hidden')}
function login(){if(pin.value!='2026')return alert('PIN incorrecto');ventas.classList.remove('hidden');let a=JSON.parse(localStorage.dt||'[]'),t=0;lista.innerHTML=a.length?a.map(x=>{t+=x.total;return '<div class="sale"><b>'+x.cliente+'</b> — $'+x.total+'<br><span class="small">'+x.fecha+' · '+x.pago+'<br>'+x.items+'</span></div>'}).join(''):'No hay ventas registradas.';st.textContent='$'+t}
render()
</script>
</body>
</html>
